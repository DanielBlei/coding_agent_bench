name: Deploy to OpenShift

on:
  pull_request:
    types: [closed]
    branches:
      - stage
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' || github.event.pull_request.base.ref == 'main') && 'production' || 'stage' }}
    env:
      OVERLAY: ${{ (github.event_name == 'push' || github.event.pull_request.base.ref == 'main') && 'prod' || 'stage' }}
      NAMESPACE: ${{ (github.event_name == 'push' || github.event.pull_request.base.ref == 'main') && vars.PROD_NAMESPACE || vars.STAGE_NAMESPACE }}
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
          openshift_token: ${{ env.OPENSHIFT_TOKEN }}
          namespace: ${{ env.NAMESPACE }}

      - name: Verify application Secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "$NAMESPACE"
          for secret in harbor-minio job-queue-secret; do
            oc -n "$NAMESPACE" get secret "$secret" >/dev/null
          done
          if oc -n "$NAMESPACE" get secret intake-poller-secret >/dev/null 2>&1; then
            for key in ALLOW_INSECURE_QUEUE_HTTP SMTP_HOST SMTP_PORT SMTP_STARTTLS; do
              test -n "$(oc -n "$NAMESPACE" get secret intake-poller-secret -o "jsonpath={.data.$key}")"
            done
          fi

      - name: Apply MinIO
        run: oc apply -k deploy/minio/overlays/$OVERLAY -n "$NAMESPACE"
      
      - name: Wait for MinIO rollout
        run: oc rollout status deployment/harbor-minio -n "$NAMESPACE" --timeout=10m

      - name: Apply job queue
        run: oc apply -k deploy/job-queue/overlays/$OVERLAY -n "$NAMESPACE"

      - name: Wait for job queue rollout
        run: oc rollout status deployment/job-queue -n "$NAMESPACE" --timeout=10m

      - name: Apply intake poller
        run: |
          if oc -n "$NAMESPACE" get secret intake-poller-secret >/dev/null 2>&1; then
            oc apply -k deploy/intake-poller/overlays/$OVERLAY -n "$NAMESPACE"
          fi
