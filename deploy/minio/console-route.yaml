apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: harbor-minio
    component: minio
  name: harbor-minio-console
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  port:
    targetPort: 9001
  to:
    kind: Service
    name: harbor-minio
    weight: 100
  wildcardPolicy: None
