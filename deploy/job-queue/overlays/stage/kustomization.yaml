apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/redhat-et/coding_agent_bench
    newTag: stage

patches:
  - target:
      kind: Deployment
      name: job-queue
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: stage
